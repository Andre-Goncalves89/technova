<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechNova - Hardware Lab</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

    <header>
        <div class="logo-area">
            <img src="technova.png" alt="TechNova Lab" class="logo-img">
        </div>

        <div class="header-actions">
            <div id="walletDisplay" class="wallet-display" data-cy="wallet-display">
                <i class="fas fa-wallet"></i>
                <span id="balanceValue">R$ 0,00</span>
            </div>

            <div id="cartOpenBtn" class="cart-icon" data-cy="cart-open-btn">
                <i class="fas fa-shopping-cart"></i>
                <span id="cartBadge" class="cart-badge" data-cy="cart-badge">0</span>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="search-section">
            <div class="search-bar-container">
                <div class="search-bar">
                    <input type="text" id="searchInput" maxlength="100"
                        placeholder="O que vamos testar hoje? (ex: RTX)..." data-cy="search-input">
                    <button id="searchButton" class="buy-btn" style="width: auto; margin-top: 0; padding: 0 25px;"
                        data-cy="search-btn">
                        <i class="fas fa-search"></i>
                    </button>
                </div>

                <div class="counter-container">
                    <span id="charCounter" data-cy="char-counter">0/100</span>
                </div>
            </div>

            <div id="searchNotification" class="notification-box" style="display: none;" data-cy="search-notification">
            </div>
        </div>

        <div id="productGrid" class="product-grid" data-cy="product-grid">
            <!-- Os cards aparecerão aqui -->
        </div>
    </div>

    <!-- SIDEBAR DO CARRINHO DE COMPRAS -->
    <div id="cartOverlay" class="cart-overlay" data-cy="cart-overlay"></div>

    <div id="cartSidebar" class="cart-sidebar" data-cy="cart-sidebar">
        <div class="cart-header">
            <h2><i class="fas fa-shopping-cart"></i> Seu Carrinho</h2>
            <button id="cartCloseBtn" class="close-btn" data-cy="cart-close-btn">&times;</button>
        </div>

        <div id="cartItems" class="cart-items" data-cy="cart-items">
            <div class="empty-cart-msg">Seu laboratório de compras está vazio.</div>
        </div>

        <div class="cart-footer">
            <div class="cart-total">
                <span>Total Estimado:</span>
                <span id="cartTotalValue" data-cy="cart-total-value">R$ 0,00</span>
            </div>
            <!-- FIX DESIGN: Classe alterada de buy-button para buy-btn -->
            <button id="checkoutBtn" class="buy-btn" style="width: 100%; font-size: 1.1rem; padding: 15px;"
                data-cy="checkout-btn">
                <i class="fas fa-check-circle"></i> Finalizar Compra
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
