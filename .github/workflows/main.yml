name: TechNova CI/CD (Docker Ready)

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  e2e-testing:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Checkout do Repositório
        uses: actions/checkout@v4

      - name: 🔐 Criar arquivo .env para o Docker
        run: |
          echo "DB_HOST=db" > .env
          echo "DB_PORT=5432" >> .env
          echo "DB_USER=admin" >> .env
          echo "DB_PASSWORD=technovapass" >> .env
          echo "DB_NAME=admin" >> .env

      - name: 🐳 Subir Infraestrutura Full Stack (Docker Compose)
        run: docker compose up -d --build

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ⏳ Aguardar Frontend e API ficarem prontos
        run: npx wait-on http://localhost:3000 http://localhost:5000/api/v1/wallet --timeout 120000

      - name: 📦 Instalar dependências do Playwright
        working-directory: qa/playwright
        run: npm ci

      - name: 🌐 Instalar navegadores do Playwright
        working-directory: qa/playwright
        run: npx playwright install --with-deps

      - name: 🎭 Executar Testes E2E (Playwright)
        working-directory: qa/playwright
        run: npx playwright test

      - name: 📊 Salvar Relatório HTML do Playwright como artefato
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: qa/playwright/playwright-report/
          retention-days: 30