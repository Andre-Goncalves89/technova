version: '3.8'

services:
  db:
    image: postgres:15
    container_name: technova-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: technovapass
      POSTGRES_DB: technova_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data: